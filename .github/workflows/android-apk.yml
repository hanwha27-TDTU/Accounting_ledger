name: Android APK

# 이 워크플로는 android-shell/ 경로가 바뀌어 main에 반영될 때만 돈다 — 웹(index.html)만 바뀐
# 커밋에서는 절대 트리거되지 않는다(웹은 웹대로, "항상 최신 링크"는 index.html의 자동 새로고침이
# 담당하고, 이 워크플로는 셸 자체가 바뀔 때만 새 APK를 굽는다).
on:
  push:
    branches: [main]
    paths:
      - 'android-shell/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

# 고정 릴리스 태그·자산 파일명 — index.html의 APK_INFO 상수, scripts/harness-check.mjs의
# apk-link-contract 게이트와 반드시 같은 값이어야 한다(그 게이트가 일치를 강제한다). 새 태그를
# 만들지 않고 이 태그에 --clobber로 계속 덮어써서 다운로드 링크가 절대 바뀌지 않게 한다.
# VERSION_ASSET_NAME은 셸(APK) 자체의 versionCode만 담은 작은 JSON — 앱이 이미 설치된 뒤에도
# "셸 자체가 새로 나왔는지"를 APK 전체를 받지 않고 가볍게 확인할 수 있게 한다.
env:
  RELEASE_TAG: apk-latest
  APK_ASSET_NAME: bareunjangbu-latest.apk
  VERSION_ASSET_NAME: bareunjangbu-shell-version.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install shell dependencies
        working-directory: android-shell
        run: npm ci

      - name: Sync Capacitor Android project
        working-directory: android-shell
        run: npx cap sync android

      - name: Require complete release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::공식 APK는 release signing secret 4종이 모두 있어야 발행할 수 있습니다."
            exit 1
          fi

      # release.jks는 app/build.gradle의 signingConfigs.release가 file(RELEASE_STORE_FILE)로
      # app 모듈 기준 상대경로를 푸는 것과 맞춰 android-shell/android/app/ 밑에 써야 한다.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: android-shell/android/app
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks

      # github.run_number는 이 워크플로가 돌 때마다 항상 1씩 늘어난다 — 셸을 다시 빌드할 때마다
      # versionCode가 자동으로 올라가므로, 이미 설치된 앱이 "셸 자체가 새로 나왔는지"를 이 숫자
      # 하나만 비교해서 판단할 수 있다(수동으로 버전을 관리할 필요가 없다).
      - name: Build release APK (signed)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android-shell/android
        run: |
          ./gradlew assembleRelease \
            -PAPP_VERSION_CODE=${{ github.run_number }} \
            -PRELEASE_STORE_FILE=release.jks \
            "-PRELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" \
            "-PRELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" \
            "-PRELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"

      - name: Rename to fixed asset filename
        working-directory: android-shell/android
        run: cp "$APK_PATH" "$APK_ASSET_NAME"

      - name: Write shell version manifest
        working-directory: android-shell/android
        run: |
          printf '{"versionCode": %s, "signed": %s}' \
            "${{ github.run_number }}" \
            "true" \
            > "$VERSION_ASSET_NAME"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bareunjangbu-apk
          path: |
            android-shell/android/${{ env.APK_ASSET_NAME }}
            android-shell/android/${{ env.VERSION_ASSET_NAME }}
          retention-days: 30

      # 릴리스 설명(body) 끝의 shell-version 마커는 사람용 문구가 아니라 앱이 읽는 값이다 —
      # 설치된 앱(index.html의 CapacitorShell.checkForShellUpdate)이 api.github.com으로 이
      # 설명을 읽어 새 빌드를 감지한다. 자산 파일(bareunjangbu-shell-version.json)을 직접
      # fetch하는 방식은 github.com 리다이렉트에 CORS 헤더가 없어 웹뷰에서 차단되므로(실기기
      # 실측), 이 마커가 유일하게 동작하는 감지 경로다. 마커 형식을 바꾸면 APK_INFO.releaseApiUrl
      # 파서(parseShellVersionFromReleaseBody)와 하네스 apk-link-contract 게이트도 함께 바꿔야 한다.
      - name: Publish/overwrite fixed-tag release
        run: |
          NOTES="이 릴리스는 항상 최신 셸 빌드를 가리킵니다. 커밋마다 이 자산을 덮어쓰며 새 태그를 만들지 않습니다 — 다운로드 링크는 절대 바뀌지 않습니다.

          <!-- shell-version: {\"versionCode\": ${{ github.run_number }}, \"signed\": true} -->"
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "android-shell/android/$APK_ASSET_NAME" \
              "android-shell/android/$VERSION_ASSET_NAME" \
              --clobber --repo "${{ github.repository }}"
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" \
              "android-shell/android/$APK_ASSET_NAME" \
              "android-shell/android/$VERSION_ASSET_NAME" \
              --repo "${{ github.repository }}" \
              --title "바른장부 Android (최신)" \
              --notes "$NOTES"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
